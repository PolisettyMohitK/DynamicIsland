[package]
name = "dynamic-island"
version = "1.0.0"
description = "A dynamic island for Windows, with Choco"
authors = ["Polisetty Mohit K"]
edition = "2021"

[lib]
name = "dynamic_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
drag = "2"
cpal = "0.15"
ort = "=2.0.0-rc.15"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
png = "0.18"
base64 = "0.22"
sysinfo = { version = "0.35", default-features = false, features = ["system", "disk", "network"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-specific deps can go here later

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Devices_Radios",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Networking_Connectivity",
  "Storage_Streams",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Dxgi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Rpc",
  "Win32_System_Shutdown",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_UI_Shell_PropertiesSystem",
] }
# The same versions Tauri's WebView2 uses, for suspending it in game mode.
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
